<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarSpotter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --asphalt:#15181b;
  --asphalt-2:#1b1f23;
  --steel:#22262a;
  --steel-2:#282d32;
  --line:#343a40;
  --chalk:#f2ede2;
  --chalk-dim:#9c988f;
  --yellow:#ffc94a;
  --yellow-dim:#4a3f22;
  --green:#7cb88f;
  --green-dim:#22301f;
  --rust:#d1683c;
  --rust-dim:#3a2018;
  --radius:14px;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:#0b0c0d;
  font-family:'Inter',sans-serif;
  color:var(--chalk);
  display:flex;
  justify-content:center;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:420px;
  min-height:100vh;
  background:var(--asphalt);
  display:flex;
  flex-direction:column;
  position:relative;
  border-top:4px solid;
  border-image:repeating-linear-gradient(45deg,var(--yellow) 0 10px,var(--asphalt) 10px 20px) 4;
  overflow:hidden;
}

/* ---------- TOPBAR ---------- */
.topbar{
  padding:18px 20px 14px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.topbar .back-btn{
  display:none;
  width:34px; height:34px;
  border-radius:50%;
  background:var(--steel);
  border:1px solid var(--line);
  align-items:center; justify-content:center;
  color:var(--chalk);
  cursor:pointer;
  flex-shrink:0;
}
.topbar.has-back .back-btn{ display:flex; }
.topbar-titles{ flex:1; min-width:0; }
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:.14em;
  color:var(--yellow);
  text-transform:uppercase;
  margin-bottom:2px;
}
.title{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:22px;
  letter-spacing:.01em;
  text-transform:uppercase;
  line-height:1.1;
}

/* ---------- SCREENS ---------- */
main{ flex:1; position:relative; overflow:hidden; }
.screen{
  position:absolute; inset:0;
  overflow-y:auto;
  padding-bottom:24px;
  opacity:0; pointer-events:none;
  transform:translateX(12px);
  transition:opacity .22s ease, transform .22s ease;
}
.screen.active{ opacity:1; pointer-events:auto; transform:translateX(0); }
.screen::-webkit-scrollbar{ display:none; }

/* ---------- GARAGE: stat strip ---------- */
.stats{
  display:flex;
  padding:16px 20px 4px;
  gap:0;
}
.stat{ flex:1; }
.stat-num{
  font-family:'JetBrains Mono',monospace;
  font-variant-numeric:tabular-nums;
  font-size:22px;
  font-weight:700;
  color:var(--chalk);
}
.stat-label{
  font-size:10px;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--chalk-dim);
  margin-top:2px;
}

/* ---------- FILTER CHIPS ---------- */
.chips{
  display:flex; gap:8px;
  padding:14px 20px 6px;
  overflow-x:auto;
  scrollbar-width:none;
}
.chips::-webkit-scrollbar{ display:none; }
.chip{
  flex-shrink:0;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  font-weight:500;
  letter-spacing:.03em;
  padding:7px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--steel);
  color:var(--chalk-dim);
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s ease;
}
.chip.active{
  background:var(--yellow);
  border-color:var(--yellow);
  color:var(--asphalt);
  font-weight:700;
}

/* ---------- GARAGE GRID / TICKET CARDS ---------- */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:14px 20px 10px;
}
.card{
  background:var(--steel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  cursor:pointer;
  transition:transform .12s ease, border-color .12s ease;
  animation:cardIn .35s ease backwards;
}
.card:active{ transform:scale(.97); }
@keyframes cardIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

.card-photo{
  aspect-ratio:4/3;
  position:relative;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.card-photo svg{ width:62%; height:62%; opacity:.92; }
.card-photo::after{
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(180deg, transparent 55%, rgba(0,0,0,.35) 100%);
}
.stamp{
  position:absolute; top:7px; right:7px;
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px; font-weight:700;
  padding:3px 6px;
  border-radius:5px;
  border:1px solid currentColor;
  transform:rotate(-6deg);
  letter-spacing:.02em;
  z-index:2;
  backdrop-filter:blur(2px);
}
.stamp.high{ color:var(--green); background:rgba(34,48,31,.65); }
.stamp.mid{ color:var(--yellow); background:rgba(74,63,34,.65); }
.stamp.low{ color:var(--rust); background:rgba(58,32,24,.65); }

.perforation{
  height:10px;
  background:var(--asphalt);
  position:relative;
  border-top:1px dashed var(--line);
}
.perforation::before, .perforation::after{
  content:'';
  position:absolute; top:-6px;
  width:11px; height:11px;
  border-radius:50%;
  background:var(--asphalt-2);
}
.perforation::before{ left:-6px; }
.perforation::after{ right:-6px; }

.card-info{ padding:10px 11px 12px; }
.card-brand{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  font-weight:700;
  letter-spacing:.03em;
}
.card-model{
  font-size:12px;
  color:var(--chalk-dim);
  margin-top:1px;
}
.card-meta{
  display:flex; justify-content:space-between;
  margin-top:7px;
  font-size:10px;
  color:var(--chalk-dim);
  font-family:'JetBrains Mono',monospace;
  letter-spacing:.01em;
}

.fab{
  position:absolute;
  bottom:86px; right:20px;
  width:52px; height:52px;
  border-radius:50%;
  background:var(--yellow);
  color:var(--asphalt);
  border:none;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 20px rgba(255,201,74,.25);
  cursor:pointer;
  z-index:5;
}
.fab:active{ transform:scale(.93); }
.fab svg{ width:22px; height:22px; }

/* ---------- CAPTURE SCREEN ---------- */
.viewfinder-wrap{
  padding:18px 20px 10px;
  display:flex; flex-direction:column; height:100%;
}
.viewfinder{
  flex:1;
  min-height:340px;
  border-radius:18px;
  background:
    radial-gradient(ellipse at 50% 30%, #262b2f 0%, #15181b 75%);
  position:relative;
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line);
}
.vf-corner{
  position:absolute; width:26px; height:26px;
  border:2.5px solid var(--yellow);
}
.vf-corner.tl{ top:16px; left:16px; border-right:none; border-bottom:none; border-radius:6px 0 0 0;}
.vf-corner.tr{ top:16px; right:16px; border-left:none; border-bottom:none; border-radius:0 6px 0 0;}
.vf-corner.bl{ bottom:16px; left:16px; border-right:none; border-top:none; border-radius:0 0 0 6px;}
.vf-corner.br{ bottom:16px; right:16px; border-left:none; border-top:none; border-radius:0 0 6px 0;}
.vf-hint{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--chalk-dim);
  text-align:center;
  padding:0 40px;
  line-height:1.5;
}
.vf-silhouette{ width:52%; opacity:.18; }

.scan-line{
  position:absolute; left:8%; right:8%; height:2px;
  background:linear-gradient(90deg, transparent, var(--yellow), transparent);
  top:20%;
  opacity:0;
  box-shadow:0 0 12px 1px var(--yellow);
}
.scanning .scan-line{ animation:scanMove 1.3s ease-in-out infinite; opacity:1; }
@keyframes scanMove{ 0%{top:18%;} 50%{top:78%;} 100%{top:18%;} }

.scanning .vf-hint{ display:none; }
.processing-tag{
  display:none;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.08em;
  color:var(--yellow);
  text-transform:uppercase;
  position:absolute; bottom:18px; left:0; right:0; text-align:center;
}
.scanning .processing-tag{ display:block; }

.capture-controls{
  display:flex; align-items:center; justify-content:center;
  gap:34px;
  padding:22px 0 8px;
}
.gallery-btn{
  width:42px; height:42px; border-radius:10px;
  background:var(--steel); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  color:var(--chalk-dim); cursor:pointer;
}
.shutter{
  width:70px; height:70px; border-radius:50%;
  background:transparent;
  border:3px solid var(--chalk);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.shutter::after{
  content:'';
  width:56px; height:56px; border-radius:50%;
  background:var(--yellow);
  transition:transform .12s ease;
}
.shutter:active::after{ transform:scale(.88); }
.shutter[disabled]{ opacity:.5; pointer-events:none; }
.spacer42{ width:42px; }

/* ---------- CONFIRM SCREEN ---------- */
.confirm-photo{
  margin:16px 20px 0;
  border-radius:var(--radius);
  aspect-ratio:16/10;
  position:relative;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  border:1px solid var(--line);
}
.confirm-photo svg{ width:48%; height:48%; }

.gauge-wrap{
  display:flex; flex-direction:column; align-items:center;
  padding:22px 20px 6px;
}
.gauge-caption{
  font-family:'JetBrains Mono',monospace;
  font-size:10px; letter-spacing:.14em;
  color:var(--chalk-dim); text-transform:uppercase;
  margin-top:8px;
}
.gauge-num{
  font-family:'JetBrains Mono',monospace;
  font-weight:700; font-size:15px;
}

.fields{ padding:14px 20px 6px; display:flex; flex-direction:column; gap:12px; }
.field-label{
  font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--chalk-dim); margin-bottom:6px;
  font-family:'JetBrains Mono',monospace;
}
.field-input{
  width:100%;
  background:var(--steel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 13px;
  color:var(--chalk);
  font-family:'JetBrains Mono',monospace;
  font-size:15px;
  font-weight:600;
  letter-spacing:.02em;
  outline:none;
}
.field-input:focus{ border-color:var(--yellow); }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }

.confirm-actions{ padding:22px 20px 10px; display:flex; flex-direction:column; gap:10px; }
.btn{
  width:100%; padding:15px; border-radius:12px; border:none;
  font-family:'Inter',sans-serif; font-weight:700; font-size:15px;
  cursor:pointer; text-align:center;
}
.btn-primary{ background:var(--yellow); color:var(--asphalt); }
.btn-primary:active{ transform:scale(.98); }
.btn-ghost{ background:transparent; color:var(--chalk-dim); border:1px solid var(--line); }

/* ---------- TABBAR ---------- */
.tabbar{
  display:flex;
  border-top:1px solid var(--line);
  background:var(--asphalt-2);
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom);
}
.app.hide-tabbar .tabbar{ display:none; }
.tab{
  flex:1; padding:11px 0 9px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; cursor:pointer;
  color:var(--chalk-dim);
}
.tab svg{ width:21px; height:21px; }
.tab span{
  font-size:10.5px; font-weight:600; letter-spacing:.02em;
  font-family:'Inter',sans-serif;
}
.tab.active{ color:var(--yellow); }

/* ---------- TOAST ---------- */
.toast{
  position:absolute; left:20px; right:20px; bottom:96px;
  background:var(--green-dim);
  border:1px solid var(--green);
  color:var(--green);
  padding:12px 14px; border-radius:10px;
  font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:8px;
  transform:translateY(20px); opacity:0;
  transition:transform .25s ease, opacity .25s ease;
  z-index:20; pointer-events:none;
}
.toast.show{ transform:translateY(0); opacity:1; }
.toast svg{ width:16px; height:16px; flex-shrink:0; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body>

<div class="app" id="app">

  <header class="topbar" id="topbar">
    <button class="back-btn" id="backBtn" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="topbar-titles">
      <div class="eyebrow" id="eyebrow">Гараж уличных находок</div>
      <div class="title" id="pageTitle">Гараж</div>
    </div>
  </header>

  <main>
    <!-- ===== GARAGE ===== -->
    <section class="screen active" id="screen-garage">
      <div class="stats">
        <div class="stat"><div class="stat-num" id="statTotal">6</div><div class="stat-label">Машин</div></div>
        <div class="stat"><div class="stat-num" id="statBrands">6</div><div class="stat-label">Марок</div></div>
        <div class="stat"><div class="stat-num">3</div><div class="stat-label">За август</div></div>
      </div>

      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- ===== CAPTURE ===== -->
    <section class="screen" id="screen-capture">
      <div class="viewfinder-wrap">
        <div class="viewfinder" id="viewfinder">
          <div class="vf-corner tl"></div>
          <div class="vf-corner tr"></div>
          <div class="vf-corner bl"></div>
          <div class="vf-corner br"></div>
          <div class="scan-line"></div>
          <svg class="vf-silhouette" viewBox="0 0 120 60" fill="none"><use href="#car-icon"/></svg>
          <div class="vf-hint">Наведи камеру на машину<br>и сделай снимок</div>
          <div class="processing-tag">Распознаём модель…</div>
        </div>
        <div class="capture-controls">
          <button class="gallery-btn" aria-label="Из галереи">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="9.5" r="1.5" fill="currentColor"/><path d="M4 16l5-4.5 4 3 3-2.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="shutter" id="shutterBtn" aria-label="Сделать снимок"></button>
          <div class="spacer42"></div>
        </div>
      </div>
    </section>

    <!-- ===== CONFIRM ===== -->
    <section class="screen" id="screen-confirm">
      <div class="confirm-photo" id="confirmPhoto"></div>

      <div class="gauge-wrap">
        <svg width="180" height="104" viewBox="0 0 180 104" id="gaugeSvg">
          <path d="M14 96 A76 76 0 0 1 66.8 22.7" stroke="var(--rust)" stroke-width="12" fill="none" stroke-linecap="round"/>
          <path d="M66.8 22.7 A76 76 0 0 1 113.2 22.7" stroke="var(--yellow)" stroke-width="12" fill="none" stroke-linecap="round"/>
          <path d="M113.2 22.7 A76 76 0 0 1 166 96" stroke="var(--green)" stroke-width="12" fill="none" stroke-linecap="round"/>
          <g id="needle" style="transform-origin:90px 96px; transform:rotate(-90deg); transition:transform 1s cubic-bezier(.22,1.4,.36,1);">
            <line x1="90" y1="96" x2="90" y2="32" stroke="var(--chalk)" stroke-width="2.5" stroke-linecap="round"/>
          </g>
          <circle cx="90" cy="96" r="5.5" fill="var(--chalk)"/>
        </svg>
        <div class="gauge-num"><span id="confNum">0</span>% совпадение</div>
        <div class="gauge-caption">Уверенность ИИ</div>
      </div>

      <div class="fields">
        <div class="field">
          <div class="field-label">Марка</div>
          <input class="field-input" id="fieldBrand" value="">
        </div>
        <div class="field">
          <div class="field-label">Модель</div>
          <input class="field-input" id="fieldModel" value="">
        </div>
        <div class="field-row">
          <div class="field">
            <div class="field-label">Год</div>
            <input class="field-input" id="fieldYear" value="">
          </div>
          <div class="field">
            <div class="field-label">Место</div>
            <input class="field-input" id="fieldPlace" value="Рига">
          </div>
        </div>
      </div>

      <div class="confirm-actions">
        <button class="btn btn-primary" id="addBtn">Добавить в гараж</button>
        <button class="btn btn-ghost" id="cancelBtn">Снять заново</button>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="garage">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Гараж</span>
    </button>
    <button class="tab" data-tab="capture">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1-1.6A1.5 1.5 0 0 1 10 4.6h4a1.5 1.5 0 0 1 1.3.8L16.3 7h2.2A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="3.4" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Камера</span>
    </button>
  </nav>

  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span id="toastText">Добавлено в гараж</span>
  </div>
</div>

<!-- reusable car silhouette -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="car-icon" viewBox="0 0 120 60">
    <path d="M8 42 C6 42 5 40 6 37 L11 26 C12.5 22 16 19 20.5 19 L34 19 L42 9 C44 6.5 47 5 50.5 5 L74 5 C78 5 81.5 7 84 10.5 L92 21 L101 23 C107 24.5 112 30 112 36 L112 42" stroke="currentColor" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 42 L114 42" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M40 19 L44 8 M62 19 L62 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="30" cy="45" r="9" fill="var(--asphalt)" stroke="currentColor" stroke-width="3.4"/>
    <circle cx="90" cy="45" r="9" fill="var(--asphalt)" stroke="currentColor" stroke-width="3.4"/>
  </symbol>
</svg>

<script>
const GARAGE = [
  {brand:'TOYOTA', model:'Camry', year:2018, date:'12 авг', place:'Рига, центр', conf:96, tint:'#5a3a30'},
  {brand:'BMW', model:'3 Series', year:2015, date:'10 авг', place:'Юрмала', conf:89, tint:'#2c4258'},
  {brand:'LADA', model:'Vesta', year:2021, date:'8 авг', place:'Пурвциемс', conf:99, tint:'#33502f'},
  {brand:'MERCEDES', model:'E-Class', year:2012, date:'3 авг', place:'Рига, центр', conf:78, tint:'#4a4b50'},
  {brand:'AUDI', model:'A6', year:2019, date:'29 июл', place:'Рига', conf:93, tint:'#3a4560'},
  {brand:'VOLKSWAGEN', model:'Golf', year:2016, date:'22 июл', place:'Саласпилс', conf:85, tint:'#565c33'},
];

const POOL = [
  {brand:'SKODA', model:'Octavia', year:2017, conf:91, tint:'#345248'},
  {brand:'HONDA', model:'Civic', year:2014, conf:82, tint:'#5c4326'},
  {brand:'FORD', model:'Focus', year:2013, conf:74, tint:'#443a58'},
  {brand:'RENAULT', model:'Duster', year:2020, conf:95, tint:'#265246'},
  {brand:'NISSAN', model:'Qashqai', year:2016, conf:88, tint:'#514a2c'},
];

let activeFilter = 'ALL';
let pending = null;

function confClass(c){ return c>=90 ? 'high' : c>=75 ? 'mid' : 'low'; }
function carSVG(tint){
  return `<div style="position:absolute;inset:0;background:${tint}"></div>
    <svg viewBox="0 0 120 60" fill="none" style="position:relative;color:rgba(242,237,226,.88)"><use href="#car-icon"/></svg>`;
}

function renderChips(){
  const brands = ['ALL', ...new Set(GARAGE.map(c=>c.brand))];
  const wrap = document.getElementById('chips');
  wrap.innerHTML = brands.map(b=>
    `<button class="chip ${b===activeFilter?'active':''}" data-brand="${b}">${b==='ALL'?'Все':b}</button>`
  ).join('');
  wrap.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{ activeFilter = el.dataset.brand; renderChips(); renderGrid(); });
  });
}

function renderGrid(){
  const list = activeFilter==='ALL' ? GARAGE : GARAGE.filter(c=>c.brand===activeFilter);
  const grid = document.getElementById('grid');
  grid.innerHTML = list.map((c,i)=>`
    <div class="card" style="animation-delay:${i*35}ms">
      <div class="card-photo">
        ${carSVG(c.tint)}
        <div class="stamp ${confClass(c.conf)}">${c.conf}%</div>
      </div>
      <div class="perforation"></div>
      <div class="card-info">
        <div class="card-brand">${c.brand}</div>
        <div class="card-model">${c.model} · ${c.year}</div>
        <div class="card-meta"><span>${c.date}</span><span>${c.place}</span></div>
      </div>
    </div>
  `).join('');
  document.getElementById('statTotal').textContent = GARAGE.length;
  document.getElementById('statBrands').textContent = new Set(GARAGE.map(c=>c.brand)).size;
}

function setScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');

  const app = document.getElementById('app');
  const topbar = document.getElementById('topbar');
  const eyebrow = document.getElementById('eyebrow');
  const pageTitle = document.getElementById('pageTitle');

  if(name==='garage'){
    app.classList.remove('hide-tabbar'); topbar.classList.remove('has-back');
    eyebrow.textContent='Гараж уличных находок'; pageTitle.textContent='Гараж';
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab==='garage'));
  } else if(name==='capture'){
    app.classList.remove('hide-tabbar'); topbar.classList.remove('has-back');
    eyebrow.textContent='Новая находка'; pageTitle.textContent='Камера';
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab==='capture'));
  } else if(name==='confirm'){
    app.classList.add('hide-tabbar'); topbar.classList.add('has-back');
    eyebrow.textContent='Проверь результат'; pageTitle.textContent='Опознано';
  }
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=> setScreen(t.dataset.tab));
});
document.getElementById('backBtn').addEventListener('click', ()=> setScreen('capture'));

document.getElementById('shutterBtn').addEventListener('click', function(){
  const vf = document.getElementById('viewfinder');
  const btn = this;
  vf.classList.add('scanning');
  btn.setAttribute('disabled','');
  setTimeout(()=>{
    vf.classList.remove('scanning');
    btn.removeAttribute('disabled');
    pending = POOL[Math.floor(Math.random()*POOL.length)];
    populateConfirm(pending);
    setScreen('confirm');
  }, 1350);
});

function populateConfirm(car){
  document.getElementById('confirmPhoto').innerHTML = carSVG(car.tint);
  document.getElementById('fieldBrand').value = car.brand.charAt(0)+car.brand.slice(1).toLowerCase();
  document.getElementById('fieldModel').value = car.model;
  document.getElementById('fieldYear').value = car.year;

  const needle = document.getElementById('needle');
  const confNum = document.getElementById('confNum');
  needle.style.transform = 'rotate(-90deg)';
  confNum.textContent = '0';
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      const angle = -90 + (car.conf/100)*180;
      needle.style.transform = `rotate(${angle}deg)`;
      let start=0;
      const step = Math.max(1, Math.round(car.conf/28));
      const iv = setInterval(()=>{
        start = Math.min(car.conf, start+step);
        confNum.textContent = start;
        if(start>=car.conf) clearInterval(iv);
      }, 22);
    }, 80);
  });
}

document.getElementById('cancelBtn').addEventListener('click', ()=> setScreen('capture'));
document.getElementById('addBtn').addEventListener('click', ()=>{
  if(pending){
    GARAGE.unshift({
      brand:pending.brand, model:pending.model, year:pending.year,
      date:'сегодня', place: document.getElementById('fieldPlace').value || 'Рига',
      conf:pending.conf, tint:pending.tint
    });
  }
  renderChips(); renderGrid();
  setScreen('garage');
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 2200);
});

renderChips();
renderGrid();
</script>

</body>
</html>
